server:
  port: ${PORT:8080}
spring:
  application:
    name: shopping-list-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:*}