server:
  port: 9100
  servlet:
    context-path: /shopping

spring:
  datasource:
    # Reemplaza [YOUR-PASSWORD] con la contraseña que pusiste al crear el proyecto en Supabase
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      # 'update' es seguro, pero 'validate' es mejor cuando ya creaste las tablas por SQL manual
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Esto ayuda a que Postgres entienda mejor los tipos de datos de Java
        jdbc:
          lob:
            non_contextual_creation: true

app:
  cors:
    allowed-origins: http://localhost:5173